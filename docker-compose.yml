services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diabeta}
      POSTGRES_USER: ${POSTGRES_USER:-diabeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diabeta_dev}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - diabeta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-diabeta} -d ${POSTGRES_DB:-diabeta}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-diabeta}:${POSTGRES_PASSWORD:-diabeta_dev}@postgres:5432/${POSTGRES_DB:-diabeta}?schema=public
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (consulta apps/api/.env.example)}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
volumes:
  diabeta_pg:
