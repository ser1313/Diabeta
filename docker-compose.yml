services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diabeta
      POSTGRES_USER: diabeta
      POSTGRES_PASSWORD: diabeta_dev
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - diabeta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U diabeta -d diabeta"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://diabeta:diabeta_dev@postgres:5432/diabeta?schema=public
      JWT_SECRET: change-this-in-production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  diabeta_pg: