plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.diabeta"
    // Flutter 3.29 usa compileSdk 35 por defecto, pero flutter_secure_storage
    // 10.x compila con la API 36. compileSdk solo afecta a la compilación;
    // targetSdk se mantiene en el valor de Flutter para no cambiar el
    // comportamiento de la app en tiempo de ejecución (ver docs/ci.md).
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId = "com.example.diabeta"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
