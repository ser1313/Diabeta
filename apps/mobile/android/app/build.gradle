plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.diabeta"
    // compileSdk 36: lo exigen los plugins (flutter_secure_storage) y es el valor
    // por defecto de Flutter 3.47. Solo afecta a la compilación.
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId = "com.example.diabeta"
        // minSdk 23 (Android 6) se mantiene: Flutter 3.47 lo admite (avisa por
        // debajo de 24). Subirlo es una decisión de producto pendiente.
        minSdk = 23
        // targetSdk 35 explícito: Flutter 3.47 usa 36 por defecto, lo que cambia
        // el comportamiento en ejecución (edge-to-edge). Decisión pendiente.
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }


    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
