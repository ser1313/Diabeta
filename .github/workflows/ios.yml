name: Diabeta iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diabeta-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.0'
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign --dart-define=API_URL=https://example.invalid
