name: Diabeta CI

concurrency:
  group: diabeta-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Versiones de herramientas y acciones documentadas en docs/ci.md.
# Las acciones se fijan por SHA de commit (verificado contra el tag indicado
# en el comentario) y todas usan el runtime node24.
jobs:
  api:
    # Imagen fijada: ubuntu-latest está migrando a Ubuntu 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://diabeta:diabeta_dev@localhost:5432/diabeta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
  mobile:
    # Ubuntu 24.04 trae Java 17 por defecto; Ubuntu 26.04 trae Java 25, que
    # Gradle 8.10.2 no admite. Se fija la imagen y, además, Java 17 explícito.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.29.0'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        if: hashFiles('apps/mobile/test/**') != ''
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.head_ref != 'codex/prisma-pool-readiness'
        with:
          name: diabeta-debug-apk-${{ github.event.pull_request.number || github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
